[project]
name = "sistema-asistencias-facial"
version = "0.1.0"
description = "Sistema local de comparación facial y registro de asistencia"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "face-recognition==1.3.0",
    "flask>=3.1,<4",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
comparar-rostros = "asistencia_facial.comparar_cli:main"
asistencia = "asistencia_facial.asistencia_cli:main"
asistencia-web = "asistencia_facial.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asistencia_facial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
