<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | Asistencia facial</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body class="page-shell page-shell--centered">
    <main class="auth-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">AF</div>
      <p class="eyebrow">Control de asistencia</p>
      <h1 id="login-title">Asistencia facial</h1>
      <p class="muted">Ingresá la contraseña para acceder al panel.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert--{{ 'success' if category == 'success' else 'error' }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form class="stack-form" method="post" action="/login">
        <div class="field-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <button class="button button--primary button--full" type="submit">Ingresar al panel</button>
      </form>
    </main>
  </body>
</html>
